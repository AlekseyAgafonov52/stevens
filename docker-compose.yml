services:
  postgres:
    image: postgres:16-alpine
    container_name: voice_assistant_db
    environment:
      POSTGRES_DB: taskapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - voice_assistant_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  voice_assistant_pg_data: